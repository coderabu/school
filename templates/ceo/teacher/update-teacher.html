{% load static %}
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clasrom | O'qituvchini tahrirlash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'ceo/teacher/update_teacher.css' %}">
</head>
<body class="auth-page">

  <div class="auth-card">

    <a href="admin.html" class="auth-back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
      Orqaga
    </a>

    <h1 class="auth-title">O'qituvchini tahrirlash</h1>

    <form class="auth-form" method="post">

      <div class="auth-field">
        <!-- value="{{ teacher.username }}" -->
        <input type="text" name="username" placeholder="Username" value="">
      </div>

      <div class="auth-field">
        <!-- value="{{ teacher.first_name }}" -->
        <input type="text" name="first_name" placeholder="First name" value="">
      </div>

      <div class="auth-field">
        <!-- value="{{ teacher.last_name }}" -->
        <input type="text" name="last_name" placeholder="Last name" value="">
      </div>

      <div class="auth-field">
        <!-- value="{{ teacher.phone }}" -->
        <input type="text" name="phone" placeholder="Phone" value="">
      </div>

      <div class="auth-field">
        <!-- value="{{ teacher.role }}" -->
        <select name="role">
          <option value="" disabled>Role</option>
          <option value="admin">Admin</option>
          <option value="teacher">O'qituvchi</option>
          <option value="student">O'quvchi</option>
        </select>
      </div>

      <div class="auth-field">
        <input type="password" name="password" placeholder="Yangi parol (o'zgartirmasangiz bo'sh qoldiring)">
      </div>

      <div class="edit-actions">
        <a href="admin.html" class="btn btn-cancel">Bekor qilish</a>
        <button type="submit" class="btn btn-save-edit">Saqlash</button>
      </div>

    </form>
  </div>

</body>
</html>
