{% load static %}

<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clasrom - Admin Panel</title>
    <link rel="stylesheet" href="{% static 'ceo/teacher/teacher.css' %}">
    <!-- Font Awesome ikonkalari (O'zgartirish va O'chirish tugmalari uchun) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="admin-container">
        <!-- Chap tomondagi menyu (Sidebar) -->
        <aside class="sidebar">
            <div class="logo">
                <h2><span>Clas</span>rom</h2>
            </div>
            <nav class="menu">
                <a href="#" class="menu-item active">O'qituvchi</a>
                <a href="#" class="menu-item">O'quvchi</a>
                <a href="#" class="menu-item">Fan</a>
                <a href="#" class="menu-item">Guruh</a>
                <a href="#" class="menu-item">Davomat</a>
                <a href="#" class="menu-item">To'lov</a>
                <a href="#" class="menu-item">Oylik</a>
            </nav>
        </aside>

        <!-- O'ng tomondagi asosiy qism (Main Content) -->
        <main class="content">
            <!-- Yuqori qism: Tugma -->
            <div class="content-header">
                <button class="btn-add">+ Qo'shish</button>
            </div>

            <!-- Kartochkalar grid joylashuvi -->
            <div class="cards-grid">

                <!-- 1-kartochka (DB dynamic loop uchun) -->
                <div class="card">
                    <div class="card-info">
                        <h3>Ali Valiyev</h3>
                        <p><strong>Mutaxassislik:</strong> Matematika</p>
                        <p><strong>Tel:</strong> +998 90 123 45 67</p>
                    </div>
                    <div class="card-actions">
                        <button class="btn-action btn-edit" title="Tahrirlash">
                            <i class="fa-solid fa-pen"></i>
                        </button>
                        <button class="btn-action btn-delete" title="O'chirish">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                </div>

                <!-- 2-kartochka (DB dynamic loop uchun) -->
                <div class="card">
                    <div class="card-info">
                        <h3>Eshmat Toshmatov</h3>
                        <p><strong>Mutaxassislik:</strong> Ingliz tili</p>
                        <p><strong>Tel:</strong> +998 91 987 65 43</p>
                    </div>
                    <div class="card-actions">
                        <button class="btn-action btn-edit" title="Tahrirlash">
                            <i class="fa-solid fa-pen"></i>
                        </button>
                        <button class="btn-action btn-delete" title="O'chirish">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                </div>

            </div>
        </main>
    </div>

</body>
</html>
