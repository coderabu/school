{% load static %}

<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clasrom | Yangi o'qituvchi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'ceo/teacher/add_teacher.css' %}">
</head>
<body class="auth-page">

  <div class="auth-card">

    <a href="admin.html" class="auth-back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
      Orqaga
    </a>

    <h1 class="auth-title">Yangi O'qituvchi</h1>

    <form class="auth-form" method="post">
    {% csrf_token %}
      <div class="auth-field">
        <input type="text" name="username" placeholder="Username">
      </div>

      <div class="auth-field">
        <input type="text" name="first_name" placeholder="First name">
      </div>

      <div class="auth-field">
        <input type="text" name="last_name" placeholder="Last name">
      </div>

      <div class="auth-field">
        <input type="text" name="phone" placeholder="Phone">
      </div>

      <div class="auth-field">
        <select name="role">
          <option value="" selected disabled>Role</option>
          <option value="admin" name="admin">Admin</option>
          <option value="teacher" name="teacher">O'qituvchi</option>
          <option value="student" name="student">O'quvchi</option>
            <option value="student" name="user">user</option>
        </select>
      </div>

      <div class="auth-field">
        <input type="password" name="password" placeholder="Password">
      </div>

      <button type="submit" class="btn btn-add auth-submit">Saqlash</button>

    </form>
  </div>

</body>
</html>
