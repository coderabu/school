{% load static %}
<!DOCTYPE html>
<html lang="uz">
<head>

<title>Clasrom | Yangi fan</title>

<body class="auth-page">

  <div class="auth-card">

    <div class="auth-logo"><span class="shield">🛡</span>Clas<span>rom</span></div>

    <a href="#" class="auth-back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
      Orqaga

    <h1 class="auth-title">Yangi Fan</h1>

    <form class="auth-form" method="post">
      {% csrf_token %}

      <div class="auth-field">
        <input type="text" name="name" placeholder="Fan nomi" required autocomplete="off">
      </div>

      <button type="submit" class="btn btn-add auth-submit">Saqlash</button>

    </form>
  </div>
